name: BPF Backport — R15-Next from R24U

on:
  workflow_dispatch:

jobs:
  backport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout R15-Next
        uses: actions/checkout@v4
        with:
          repository: straawwhaatz/Eureka-Kernel
          ref: R15-Next
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch R24U
        run: git fetch origin R24U

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate BPF diff from R24U
        run: |
          git diff HEAD..origin/R24U \
            -- \
            kernel/bpf/ \
            kernel/cgroup_bpf.c \
            include/linux/bpf.h \
            include/linux/bpf-cgroup.h \
            include/linux/bpf_types.h \
            include/linux/filter.h \
            include/uapi/linux/bpf.h \
            include/uapi/linux/bpf_common.h \
            include/uapi/linux/bpf_perf_event.h \
            net/core/filter.c \
            arch/arm64/net/ \
            > bpf_backport.diff

          echo "=== Diff stats ==="
          git diff HEAD..origin/R24U --stat \
            -- kernel/bpf/ kernel/cgroup_bpf.c \
               include/linux/bpf*.h \
               include/uapi/linux/bpf*.h \
               net/core/filter.c \
               arch/arm64/net/

          LINES=$(wc -l < bpf_backport.diff)
          echo "Diff size: $LINES lines"
          if [ "$LINES" -eq 0 ]; then
            echo "ERROR: No BPF differences found between branches."
            exit 1
          fi

      - name: Apply BPF diff
        run: |
          if git apply --3way --whitespace=nowarn bpf_backport.diff; then
            echo "Applied cleanly."
          else
            echo "Conflicts found — taking R24U version for conflicted BPF files..."
            git diff --name-only --diff-filter=U | while read f; do
              echo "  Resolving: $f"
              git checkout origin/R24U -- "$f"
            done
            git add -A
          fi

      - name: Update defconfig
        run: |
          DCONF="arch/arm64/configs/exynos7885-a30_defconfig"

          set_config() {
            sed -i "/^${1}[= ]/d" "$DCONF"
            sed -i "/^# ${1} is not set/d" "$DCONF"
            echo "${1}=${2}" >> "$DCONF"
            echo "  SET ${1}=${2}"
          }

          echo "=== Updating $DCONF ==="
          set_config CONFIG_BPF               y
          set_config CONFIG_BPF_SYSCALL        y
          set_config CONFIG_BPF_JIT            y
          set_config CONFIG_HAVE_BPF_JIT       y
          set_config CONFIG_HAVE_EBPF_JIT      y
          set_config CONFIG_BPF_JIT_ALWAYS_ON  y
          set_config CONFIG_CGROUP_BPF         y
          set_config CONFIG_BPF_EVENTS         y
          set_config CONFIG_NET_CLS_BPF        y
          set_config CONFIG_NET_ACT_BPF        y

      - name: Commit and push R15-Next-bpf
        run: |
          git add -A
          git commit -m "bpf: backport eBPF subsystem from R24U

          Sync real eBPF subsystem from R24U (Android 15+) into R15-Next.

          Enables:
          - CONFIG_BPF_SYSCALL
          - CONFIG_CGROUP_BPF
          - CONFIG_BPF_JIT (ARM64)
          - CONFIG_BPF_EVENTS
          - CONFIG_NET_CLS_BPF / NET_ACT_BPF

          Source: R24U @ $(git rev-parse --short origin/R24U)
          Base:   R15-Next @ $(git rev-parse --short HEAD~1)"

          git push origin HEAD:R15-Next-bpf --force
          echo "Done. New branch: straawwhaatz/Eureka-Kernel:R15-Next-bpf"

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpf-backport-diff
          path: bpf_backport.diff
